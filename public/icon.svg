<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0B0B0F"/>

  <!-- Back slide: upper right, represents next/queued slide -->
  <rect x="170" y="90" width="284" height="178" rx="14" fill="#1C1C24"/>
  <rect x="170" y="90" width="284" height="178" rx="14" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <rect x="200" y="132" width="144" height="10" rx="5" fill="rgba(255,255,255,0.15)"/>
  <rect x="200" y="152" width="104" height="9" rx="4.5" fill="rgba(255,255,255,0.09)"/>
  <rect x="200" y="170" width="124" height="9" rx="4.5" fill="rgba(255,255,255,0.09)"/>

  <!-- Front slide: lower left, represents current/active slide -->
  <rect x="58" y="244" width="284" height="178" rx="14" fill="#06B6D4"/>
  <rect x="88" y="286" width="160" height="12" rx="6" fill="rgba(5,43,51,0.55)"/>
  <rect x="88" y="310" width="118" height="10" rx="5" fill="rgba(5,43,51,0.38)"/>
  <rect x="88" y="328" width="138" height="10" rx="5" fill="rgba(5,43,51,0.38)"/>
</svg>
